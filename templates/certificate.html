<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Certificates</title>
    <link rel="stylesheet" href="/static/css/stylecer.css">
</head>
<body>
    <div class="certificates">
        <div class="certificate" id="certificate1" data-preview="certificates/preview1.jpg">
            <img src="/static/certificate/html.pdf" alt="Certificate Preview 1">
            <h2>HTML</h2>
        </div>
        <div class="certificate" id="certificate2" data-preview="certificates/preview2.jpg">
            <img src="certificates/preview2.jpg" alt="Certificate Preview 2">
            <h2>Course Name 2</h2>
        </div>
        <!-- Add more certificates as needed -->
    </div>

    <div class="overlay" id="overlay">
        <div class="certificate-viewer" id="certificate-viewer">
            <span class="close" id="close-btn">&times;</span>
            <iframe id="certificate-frame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script src="/static/js/cerjs.js"></script>
</body>
</html>
